<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Tarot -Saved Readings-</title>
<link rel="stylesheet" href="css/saved_readings.css">
<script src="js/loading.js"></script>
</head>

<body>

<main>
<div class="stars-container"></div>

<!-- navbar -->
<div id="navbar"></div>

<!-- Saved Readings Section -->
<section class="saved-readings-section">
    <h1>Saved Readings</h1>

    <div class="table-container">
        <table class="saved-readings-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Reading Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="saved-readings-body"></tbody>
        </table>
    </div>
</section>

</main>

<div id="cosmic-alert" class="alert-overlay">
    <div class="alert-card">
        <div class="alert-icon">
            <img src="img/halfmoon.svg" alt="" width="60" height="60">
        </div>
        <h3 id="alert-title">Cosmic Whisper</h3>
        <p id="alert-message"></p>
        
        <div class="alert-actions">
            <button id="alert-confirm-btn" class="alert-btn confirmBtn" onclick="closeCosmicAlert()">Yes</button>
            <button id="alert-cancel-btn" class="alert-btn cancelBtn" onclick="closeCosmicAlert()">Cancel</button>
        </div>
    </div>
</div>

<!-- Footer -->
<div id="footer"></div>

<script src="js/navfooter.js"></script>
<script src="js/save_reading_logic.js"></script>
<script src="js/sound-manager.js"></script>

</body>
</html>
