<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Tarot — Synthesis</title>
<link rel="stylesheet" href="css/synthesis.css">
<script src="js/loading.js"></script>
</head>

<body>

<main>
<div class="stars-container"></div>

<!--Navbar-->
<div id="navbar"></div>

<!-- Synthesis Section -->
 <section class="synthesis-section">

    <div id="card-results-container"></div>

    <div class="final-message">
        <h1>Reading Summary</h1>
        <p id="final-synthesis-text">
            Aligning your destiny with the stars...
        </p>
    </div>

</section>



<div class="action-buttons">
    <button class="primary-btn" onclick="clickClick.play(); navigateWithDelay('index.html', 0.4)">Return Home</button>
    <button class="primary-btn" onclick="clickClick.play(); navigateWithDelay('oracle.html', 0.4)">Start New Reading</button>
    <button class="primary-btn" onclick="clickClick.play(); saveReading()">Save Reading</button>
</div>

</main>

<div id="cosmic-alert" class="alert-overlay">
    <div class="alert-card">
        <div class="alert-icon">
            <img src="img/halfmoon.svg" alt="" width="60" height="60">
        </div>
        <h3 id="alert-title">Cosmic Whisper</h3>
        <p id="alert-message"></p>
        <button class="alert-btn" onclick="closeCosmicAlert()">Understood</button>
    </div>
</div>

<!-- Footer -->
<div id="footer"></div>

<script src="js/navfooter.js"></script>
<script src="js/synthesize_logic.js"></script>
<script src="js/save_reading_logic.js"></script>
<script src="js/sound-manager.js"></script>

</body>
</html>
