<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Tarot -Oracle-</title>
<link rel="stylesheet" href="css/deck.css">
<script src="js/loading.js"></script>

</head>

<body>

<main>
<!-- Navigation -->
<div id="navbar"></div>


<!-- Main Oracle Section -->
<section class="oracle-page">

    <!-- User Info Card -->
    <div class="user-card">
        <p><span>Name :</span><span id="displayName">Loading...</span></p>
        <p><span>Zodiac :</span><span id="displayZodiac">Loading...</span></p>
        <p><span>Category :</span><span id="displayCategory">Loading...</span></p>
    </div>

    <!-- Card Selection Area -->
    <div class="card-area">
        <h3>Select 3 Cards</h3>

        <button class="circle-btn" id="shufflebutton">Shuffle</button>

        <div class="card-Container" id="cardContainer"></div>

        <button class="primary-btn" onclick="clickClick.play(); checkBeforeNavigate()">Synthesize Reading</button>
    </div>

    <!-- Fetched MoonPhase -->
    <div class="moon-card">
        <h4>Current Moon</h4>
        <div class="moon-img-wrapper">
            <img src="img/loading.png" id="moonImg" alt="Moon Phase">
        </div>
        <p id="moonPhaseText">Loading Alignment...</p>
    </div>

    
</section>

</main>


<div id="cosmic-alert" class="alert-overlay">
    <div class="alert-card">
        <div class="alert-icon">
            <img src="img/halfmoon.svg" alt="" width="60" height="60">
        </div>
        <h3 id="alert-title">Cosmic Whisper</h3>
        <p id="alert-message"></p>
        <button class="alert-btn" onclick="closeCosmicAlert()">Ok</button>
    </div>
</div>


<!-- Footer -->
<div id="footer"></div>

<script src="js/navfooter.js"></script>

<script src="js/shuffle_logic.js"></script>
<script src="js/the_deck_logic.js"></script>
<script src="js/sound-manager.js"></script>

</body>
</html>
