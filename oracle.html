<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestial Tarot — Oracle Page</title>
<link rel="stylesheet" href="css/oracle.css">
<script src="js/loading.js"></script>


</head>

<body>

<!-- <div id="loadingScreen" class="loading-class" style="display: none;">
    <div class="spinner"></div>
    <p>Aligning with the stars...</p>
</div> -->

<main>
<div class="stars-container"></div>

<!--  Navigation -->
<div id="navbar"></div>

<!--  Form Section -->
<section class="oracle-form-section">
<h3>Whisper your details to the cosmos...</h3>
    <div class="oracle-form-card">

        <div class="form-row">
            <label>Name</label>
            <input type="text" id="userName" placeholder="Mg Mg" required>
        </div>

        <div class="form-row">
            <label>Zodiac</label>
            <select id="userZodiac">
                <option value="Scorpio">Scorpio</option>
                <option value="Aries">Aries</option>
                <option value="Taurus">Taurus</option>
                <option value="Gemini">Gemini</option>
                <option value="Cancer">Cancer</option>
                <option value="Leo">Leo</option>
                <option value="Virgo">Virgo</option>
                <option value="Libra">Libra</option>
                <option value="Sagittarius">Sagittarius</option>
                <option value="Capricorn">Capricorn</option>
                <option value="Aquarius">Aquarius</option>
                <option value="Pisces">Pisces</option>
            </select>
        </div>

        <div class="form-row">
            <label>Category</label>
            <select id="userCategory">
                <option value="love">Love</option>
                <option value="career">Career</option>
                <option value="financial">Financial</option>
                <option value="wellbeing">Wellbeing</option>
            </select>
        </div>

    </div>

    <button class="oracleBtn" onclick="oracleClick.play(); submitOracleForm()">Reveal Your Spread</button>

</section>

</main>

<div id="cosmic-alert" class="alert-overlay">
    <div class="alert-card">
        <div class="alert-icon">
            <img src="img/halfmoon.svg" alt="" width="60" height="60">
        </div>
        <h3 id="alert-title">Cosmic Whisper</h3>
        <p id="alert-message"></p>
        <button class="alert-btn" onclick="closeCosmicAlert()">Understood</button>
    </div>
</div>

<!-- Footer -->
<div id="footer"></div>


<script src="js/navfooter.js"></script>
<script src="js/oracle_form.js"></script>
<script src="js/sound-manager.js"></script>

</body>
</html>
